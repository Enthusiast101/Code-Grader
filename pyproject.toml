[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-grader"
version = "0.1.0"
description = "A local personal research assistant powered by a local SLM and MCP"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "docker>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]